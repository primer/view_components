name: test-system

on:
  pull_request:
  merge_group:
    branches:
      - main
    types:
      - checks_requested

permissions:
  contents: read

concurrency:
  group: test-system-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  FERRUM_PROCESS_TIMEOUT: 30

jobs:
  system:
    name: System (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser:
          - chrome
          # - firefox  # Firefox is currently disabled due to intermittent CI failures.
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            demo/package-lock.json
      - name: Set up Chrome 156
        if: matrix.browser == 'chrome'
        id: chrome
        run: |
          curl --fail --silent --show-error --location \
            https://storage.googleapis.com/chrome-for-testing-public/156.0.8078.79/linux64/chrome-linux64.zip \
            -o "$RUNNER_TEMP/chrome.zip"
          unzip -q "$RUNNER_TEMP/chrome.zip" -d "$RUNNER_TEMP/chrome-156"
          chrome_path="$RUNNER_TEMP/chrome-156/chrome-linux64/chrome"
          "$chrome_path" --version
          echo "chrome-path=$chrome_path" >> "$GITHUB_OUTPUT"
      - name: Build
        run: |
          npm ci
          cd demo && npm ci
      - name: Test
        env:
          BROWSER_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          USE_BROWSER=${{ matrix.browser }} bundle exec rake test:system
